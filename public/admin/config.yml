backend:
  name: git-gateway
  branch: main

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "conteudos"
    label: "Conteúdos / Cursos"
    folder: "content/conteudos"
    create: true
    slug: "{{slug}}"
    extension: "json"
    fields:
      - { label: "Título", name: "title", widget: "string", required: true }
      - { label: "Foto de Capa", name: "cover", widget: "image", required: true }
      - { label: "Visão Geral", name: "visao_geral", widget: "text", required: true }
      - { label: "Pra quem é", name: "pra_quem", widget: "text", required: true }
      - label: "O que você aprenderá"
        name: "aprendizado"
        widget: "list"
        required: true
        field: { label: "Item", name: "item", widget: "string" }
      - label: "Box de Informações"
        name: "info_box"
        widget: "object"
        required: true
        fields:
          - { label: "Investimento", name: "investimento", widget: "string", required: true }
          - { label: "Formato", name: "formato", widget: "string", required: true }
          - { label: "Link - Garantir minha vaga", name: "link_vaga", widget: "string", required: true }
          - { label: "Link - Tem dúvidas? Fale conosco", name: "link_contato", widget: "string", required: true }
      - label: "Tema / Seção"
        name: "tema"
        widget: "select"
        required: true
        options:
          - { label: "Homeopatia", value: "homeopatia" }
          - { label: "Constelação", value: "constelacao" }
          - { label: "Mapas", value: "mapas" }
          - { label: "Eventos", value: "eventos" }

  - name: "settings"
    label: "Configurações"
    files:
      - label: "Informações Gerais"
        name: "general"
        file: "content/settings/general.json"
        fields:
          - { label: "Número WhatsApp", name: "whatsapp", widget: "string" }
          - { label: "URL do Site", name: "siteUrl", widget: "string" }
